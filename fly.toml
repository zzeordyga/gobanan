# fly.toml app configuration file generated for gobanan on 2026-11-16T16:22:06Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'gobanan'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'php artisan migrate --force --graceful'

[env]
  APP_ENV = 'production'
  CACHE_STORE = 'database'
  LOG_CHANNEL = 'stderr'
  QUEUE_CONNECTION = 'database'
  SESSION_DRIVER = 'database'

[[mounts]]
  source = 'gobanan_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
