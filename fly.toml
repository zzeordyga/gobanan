app = "gobanan"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

# Persistent volume for the sqlite database so data survives redeploys.
# Create once with: fly volumes create gobanan_data
[[mounts]]
  source = "gobanan_data"
  destination = "/data"

[env]
  APP_ENV = "production"
  LOG_CHANNEL = "stderr"
  SESSION_DRIVER = "database"
  CACHE_STORE = "database"
  QUEUE_CONNECTION = "database"

# Release command runs migrations before the new instance takes traffic.
[deploy]
  release_command = "php artisan migrate --force --graceful"